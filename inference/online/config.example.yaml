project:
  root: "."
  pipeline_name: weldcom_l2_realtime_v1
  inference_version: realtime_v1
  l2_run_id: l2_multilabel_20260711_043347
  policy_version: policy_v2_operational_quality_split_sensitive_audit_only

database:
  driver: "ODBC Driver 17 for SQL Server"
  server: "YOUR_SQL_SERVER_NAME"
  database: "YOUR_DATABASE_NAME"
  username: "YOUR_USERNAME"
  password: "YOUR_PASSWORD"
  trusted_connection: false
  trust_server_certificate: true
  encrypt: true
  timeout_seconds: 30

tables:
  raw_iot: dbo.data_iot_convert
  machine_status: dbo.data_machine_status
  machine: dbo.data_machine
  machine_location_history: dbo.machine_location_his
  location: dbo.data_location
  checkpoint: dbo.ai_inference_checkpoint
  online_l2_result: dbo.ai_l2_fault_judgment_online_v2
  run_log: dbo.ai_inference_run_log
  error_log: dbo.ai_inference_error_log

source_columns:
  event_id: id
  machine_id: machine_id
  status_id: status_id
  event_start_time: status_time_start
  raw_event_end_time: status_time_end
  raw_kwh_start: status_kwh_start
  raw_kwh_end: status_kwh_end
  raw_error_code: error_code

machine_columns:
  machine_id: id
  machine_group_id: machine_group_id

location_columns:
  machine_id: machine_id
  location_id: location_id
  start_time: start_time
  end_time: end_time

runtime:
  dry_run: true
  enable_sql_write: false
  sql_write_target_allowlist: []
  enable_local_canary_sql_write: false
  local_canary_sql_write_target_allowlist: []
  local_canary_max_write_rows: 1
  worker_lock_path: data/runtime/online_worker.lock
  l1_batch_size: 512
  max_events_per_run: 100
  min_event_id_to_process: 0
  lookback_before: 40
  lookahead_after: 2
  window_size_l1: 20
  kwh_impute_gap_limit_seconds: 300
  small_gap_seconds: 300
  big_gap_seconds: 3600
  l2_past_event_window: 10
  long_duration_seconds: 86400

audit:
  output_root: data/realtime_audit
  historical_l1_table: dbo.ai_l1_operation_event_sequence
  historical_l1_csv: "data/dataCore/ai_l1_operation_event_sequence.csv"
  compare_with_historical_l1: true

historical:
  l1_table: "dbo.ai_l1_operation_event_sequence"
  l1_csv: "data/dataCore/ai_l1_operation_event_sequence.csv"

artifacts:
  obad_root: "."
  l1_enabled: true
  l1_artifact_dir: modeling/l1_tcn/artifacts
  l2_artifact_dir: modeling/l2_fault_classifier/artifacts/l2_multilabel_20260711_043347
  l2_production_selection: data/dataModel/l2/model_report/l2_multilabel_20260711_043347/production_profile_selection.json
  l2_feature_policy: data/dataModel/l2/prepared_report/l2_feature_policy.json
