# Weldcom OBAD - L2 dataset builder configuration
# Vị trí file: OBAD/modeling/l2_fault_classifier/configs/base.yaml
# Từ thư mục configs, muốn về gốc OBAD: ../../..

project:
  name: "weldcom_obad_l2_fault_classifier"
  seed: 42
  l2_dataset_version: "l2_with_l1_score_v1"

paths:
  project_root: "../../.."

  l1_score:
    # Ưu tiên file production đã rebuild từ Batch 04 Fix.
    production: "../../../data/dataModel/l1/scored/ai_l1_operation_anomaly_result_production.csv"

  l2:
    train: "../../../data/dataModel/l2/train.csv"
    valid: "../../../data/dataModel/l2/valid.csv"
    test:  "../../../data/dataModel/l2/test.csv"

    output_train: "../../../data/dataModel/l2/train_with_l1_score.csv"
    output_valid: "../../../data/dataModel/l2/valid_with_l1_score.csv"
    output_test:  "../../../data/dataModel/l2/test_with_l1_score.csv"

    report_dir: "../../../data/dataModel/l2/with_l1_report"

data:
  sep: ","
  encoding: "utf-8-sig"
  output_sep: ","
  output_encoding: "utf-8-sig"
  output_compression: null

join:
  key: "event_id"
  validate_l1_unique_event_id: true
  validate_l2_unique_event_id: true

  # Những cột L1 sẽ đưa sang L2.
  # Một số cột được rename để tránh nhầm với model_version/created_time của L2.
  l1_columns:
    - event_id
    - model_version
    - decision_policy

    - score_lenient
    - score_strict
    - score_lenient_norm
    - score_strict_norm

    - threshold_lenient
    - threshold_strict

    - is_anomaly_lenient
    - is_anomaly_strict
    - is_behavior_anomaly
    - is_sensitive_warning

    - behavior_anomaly_score
    - behavior_sensitive_score
    - behavior_combined_score
    - behavior_reason
    - action_level_l1

  rename_l1_columns:
    model_version: "l1_model_version"
    decision_policy: "l1_decision_policy"

  fill_numeric_l1_with_zero: true

  behavior_reason_mapping:
    INSUFFICIENT_WINDOW: 0
    NORMAL_LIKE: 1
    SENSITIVE_WARNING_ONLY: 2
    PRODUCTION_MODEL_DEVIATION: 3
    STRONG_DEVIATION_BOTH_MODELS: 4
    L1_JOIN_MISSING: 9

  action_level_mapping:
    NO_WINDOW_SCORE: 0
    NONE: 1
    MONITOR: 2
    CHECK_MACHINE: 3
    WARNING: 4
    L1_JOIN_MISSING: 9

l2:
  id_columns:
    - event_id
    - machine_id
    - sequence_segment_id
    - event_order_in_segment

  target_columns:
    - future_fault_within_10_events
    - future_fault_within_30_events
    - future_fault_within_30min
    - future_fault_within_60min
    - future_maintenance_within_30_events
    - future_repair_within_30_events

  leakage_columns:
    - next_fault_status_id
    - events_to_next_fault
    - seconds_to_next_fault

  text_or_reason_columns:
    - behavior_reason
    - action_level_l1
    - l1_model_version
    - l1_decision_policy

  recommended_l1_numeric_features:
    - score_lenient
    - score_strict
    - score_lenient_norm
    - score_strict_norm
    - behavior_anomaly_score
    - behavior_sensitive_score
    - behavior_combined_score
    - threshold_lenient
    - threshold_strict

  recommended_l1_flag_features:
    - is_anomaly_lenient
    - is_anomaly_strict
    - is_behavior_anomaly
    - is_sensitive_warning
    - l1_score_available_flag
    - l1_join_missing_flag

  recommended_l1_encoded_features:
    - behavior_reason_code
    - action_level_l1_code
